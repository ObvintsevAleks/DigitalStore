# lifecycle per_class — позволяет @BeforeAll быть нестатическим и сохранять состояние между testA и testB
junit.jupiter.testinstance.lifecycle.default=per_class

# параллельное выполнение
junit.jupiter.execution.parallel.enabled=true

# классы запускаются параллельно — каждый класс самодостаточен и работает со своими UUID
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# методы внутри класса — последовательно: testA обязан завершиться до testB
junit.jupiter.execution.parallel.mode.default=same_thread
